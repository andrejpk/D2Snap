<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>D2Snap | Demo</title>
        <link rel="stylesheet" href="./demo.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/webfuse-com/dom-relief/styles/dom-relief.css">
        <script src="https://cdn.jsdelivr.net/gh/webfuse-com/dom-relief/dist/browser/dom-relief.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/webfuse-com/accessibility-tree/dist/api.browser.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    </head>
    <body>
        <header>
            <h1>D2Snap &hairsp; | &hairsp; Demo</h1>
            <nav>
                <a class="button button--light" target="_blank" href="https://github.com/webfuse-com/D2Snap">
                    <img src="./res/github-logo.webp" alt="GitHub">
                </a>
                <a class="button button--light" target="_blank" href="https://arxiv.org/abs/2508.04412">
                    <img src="./res/arxiv-logo.webp" alt="arXiv">
                </a>
            </nav>
        </header>
        <main>
            <section class="panel content">
                <div class="textarea-wrapper">
                    <textarea name="html-input" placeholder="HTML input"></textarea>
                    <button type="button" class="button button--s clear-button" data-clear="html-input">Clear</button>
                </div>
                <div class="card">
                    <form name="downsampling-params">
                        <section>
                            <label for="downsampling-rE">
                                <code
                                    title="Element downsampling ratio – how much hierarchy to fold (relative; ratio)">
                                    rE
                                </code>
                                <input type="range" min="0" max="1" step="0.1" value="0.5" name="downsampling-rE">
                                <output for="downsampling-rE"></output>
                            </label>
                            <label for="downsampling-rT">
                                <code
                                    title="Text downsampling ratio – how much text to truncate at the sentence level (relative; ratio)">
                                    rT
                                </code>
                                <input type="range" min="0" max="1" step="0.1" value="0.5" name="downsampling-rT">
                                <output for="downsampling-rT"></output>
                            </label>
                            <label for="downsampling-rA">
                                <code
                                    title="Attribute downsampling ratio – which attributes remove based on relevance scores (absolute; threshold)">
                                    rA
                                </code>
                                <input type="range" min="0" max="1" step="0.1" value="0.5" name="downsampling-rA">
                                <output for="downsampling-rA"></output>
                            </label>
                            <table>
                                <tr>
                                    <td>
                                        <label for="downsampling-markdown"
                                            title="Whether to translate HTML text formatting to Markdown">
                                            Markdown
                                        </label>
                                    </td>
                                    <td>
                                        <input type="checkbox" name="downsampling-markdown">
                                    </td>
                                </tr>
                            </table>
                        </section>
                        <section>
                            <table>
                                <tr>
                                    <td>
                                        <label for="downsampling-normalizers"
                                            title="Whether to pre-process the DOM with the default normalizers (filtering, normalisation) before downsampling">
                                            Normalizers
                                        </label>
                                    </td>
                                    <td>
                                        <input type="checkbox" name="downsampling-normalizers" checked>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <label for="downsampling-text-ranker" title="Whether to rank text at the sentence level before truncation (TextRank) – otherwise, the leading sentences are kept">
                                            <a href="https://aclanthology.org/W04-3252/" target="_blank">TextRank</a>
                                        </label>
                                    </td>
                                    <td>
                                        <input type="checkbox" name="downsampling-text-ranker" checked>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <label for="downsampling-empty-elements"
                                            title="Whether to remove elements without contents after downsampling (void and actionable elements are kept)">
                                            Filter Empty
                                        </label>
                                    </td>
                                    <td>
                                        <input type="checkbox" name="downsampling-empty-elements" checked>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <label for="downsampling-unique-ids"
                                            title="Whether to assign unique IDs to elements (data-uid attribute) – traceable to the input DOM">
                                            Unique IDs
                                        </label>
                                    </td>
                                    <td>
                                        <input type="checkbox" name="downsampling-unique-ids">
                                    </td>
                                </tr>
                            </table>
                        </section>
                        <section>
                            <button class="button button--s" type="button" data-snapshot="google"
                                title="Example: snapshot from https://google.com">
                                Google
                            </button>
                            <button class="button button--s" type="button" data-snapshot="wikipedia"
                                title="Example: snapshot from https://wikipedia.org/wiki/Downsampling_(signal_processing)">
                                Wikipedia
                            </button>
                        </section>
                    </form>
                </div>
            </section>
            <div class="resizer" role="separator"></div>
            <section class="panel content">
                <div class="tabs">
                    <div class="tabs-body">
                        <div class="content">
                            <textarea name="html-output" readonly></textarea>
                            <button type="button" class="button button--s copy-button" data-copy="html-output">Copy</button>
                        </div>
                        <div class="content">
                            <textarea name="a11y-tree-output" readonly></textarea>
                            <button type="button" class="button copy-button" data-copy="a11y-tree-output">Copy</button>
                        </div>
                        <div class="content">
                            <textarea name="index-json-output" readonly></textarea>
                            <button type="button" class="button button--s copy-button" data-copy="index-json-output">Copy</button>
                        </div>
                        <div class="content">
                            <textarea name="index-output" readonly></textarea>
                            <button type="button" class="button button--s copy-button" data-copy="index-output">Copy</button>
                        </div>
                    </div>
                    <div class="card">
                        <div class="flex" id="dom-results">
                            <p class="nowrap"
                                title="Total downsampling duration">
                                ⏱️ &hairsp;
                                <span data-key="duration">t</span> ms
                            </p>
                            <div class="flex-space"></div>
                            <p class="flex flex--xs">
                                <span class="text-primary text-l nowrap"
                                    title="Result size compared to original size (raw bytes)">
                                    📦 &hairsp;
                                    <b data-key="sizeRatio">x</b> %
                                </span>
                                <span class="nowrap">
                                    (
                                        <span class="text-primary"><span data-key="snapshotSize">y</span></span>
                                        /
                                        <span data-key="originalSize">z</span>
                                    )
                                </span>
                                <span class="nowrap"
                                    title="Estimated LLM input tokens">
                                    ~ <span data-key="tokenEstimate">T</span> Tokens
                                </span>
                            </p>
                        </div>
                    </div>
                    <div class="tabs-header">
                        <button>HTML</button>
                        <button>Accessibility Tree</button>
                        <button>Index JSON</button>
                        <button>Index List</button>
                    </div>
                </div>
            </section>
            <div class="resizer" role="separator"></div>
            <section class="panel content">
                <div class="tabs">
                    <div class="tabs-body">
                        <div class="content">
                            <canvas id="dom-relief"></canvas>
                            <small class="float float--r text-dim no-select">Hold SHIFT to translate</small>
                            <div class="flex flex--s float float--l">
                                <label for="relief-flat">
                                    <span class="no-select">Flat</span>
                                    <input type="checkbox" name="relief-flat" autocomplete="off">
                                </label>
                                <label for="relief-ortho">
                                    <span class="no-select">Orthographic</span>
                                    <input type="checkbox" name="relief-ortho" autocomplete="off">
                                </label>
                            </div>
                        </div>
                        <div class="content">
                            <iframe data-frame="input"></iframe>
                            <hr>
                            <iframe data-frame="output"></iframe>
                        </div>
                    </div>
                    <div class="tabs-header">
                        <button>3D Footprint</button>
                        <button>GUI (no styles)</button>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <small class="text-dim">
                &copy; 2025
                &ensp; | &ensp; Beyond Pixels: Exploring DOM Downsampling for LLM-Based Web Agents
            </small>
        </footer>
        <script>
            (async () => {
                // Latest local build if available (e.g., localhost), published bundle otherwise (e.g., GitHub Pages)
                const D2SNAP_SOURCES = [
                    "../dist.browser/D2Snap.js",
                    "https://cdn.jsdelivr.net/gh/webfuse-com/d2snap/dist.browser/D2Snap.js"
                ];

                const loadScript = src => {
                    return new Promise((resolve, reject) => {
                        const script = document.createElement("script");

                        script.src = src;
                        script.addEventListener("load", resolve);
                        script.addEventListener("error", reject);

                        document.head.appendChild(script);
                    });
                };

                for(const src of D2SNAP_SOURCES) {
                    try {
                        await loadScript(src);

                        console.info(`D2Snap loaded from ${src}`);

                        break;
                    } catch {
                        console.info(`D2Snap not available from ${src}`);
                    }
                }

                await loadScript("./demo.js");
            })();
        </script>
        <script defer src="demo.snapshot.google.js"></script>
        <script defer src="demo.snapshot.wikipedia.js"></script>
    </body>
</html>
